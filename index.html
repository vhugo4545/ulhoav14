<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Ulhoa Metais</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
</head>
<body>

  <div class="auth-bg">
    <div class="auth-card">

      <!-- Marca -->
      <div class="auth-brand">
        <img src="js/logo.jpg" alt="Ulhoa Metais" class="auth-logo" onerror="this.style.display='none'" />
      </div>

      <!-- ─── LOGIN ─────────────────────────── -->
      <div id="loginForm">
        <h2 class="auth-title">Bem-vindo de volta</h2>
        <p class="auth-subtitle">Acesse sua conta para continuar</p>

        <div class="field">
          <label for="loginEmail">
            <span class="material-icons-outlined">mail_outline</span> E-mail
          </label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required />
        </div>

        <div class="field">
          <label for="loginSenha">
            <span class="material-icons-outlined">lock_outline</span> Senha
          </label>
          <div class="input-wrap">
            <input type="password" id="loginSenha" placeholder="••••••••" required />
            <button type="button" class="eye-btn" onclick="toggleSenha('loginSenha', this)">
              <span class="material-icons-outlined">visibility</span>
            </button>
          </div>
        </div>

        <button class="btn-primary" onclick="login()">
          <span class="material-icons-outlined">login</span> Entrar
        </button>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function toggleSenha(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon  = btn.querySelector('.material-icons-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
</body>
</html>
